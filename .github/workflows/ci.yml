name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lba
          POSTGRES_PASSWORD: lba
          POSTGRES_DB: lba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lba -d lba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://lba:lba@127.0.0.1:5432/lba_test
      DATABASE_URL_UNPOOLED: postgresql://lba:lba@127.0.0.1:5432/lba_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to ephemeral Postgres
        run: pnpm db:migrate

      - name: Run Phase 3 concurrency integration tests
        run: pnpm test:integration
